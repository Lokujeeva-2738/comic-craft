<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comic Preview | ComicCraft</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7c3aed;
            --primary-dark: #5b21b6;
            --secondary: #ec4899;
            --dark: #111827;
            --dark-light: #1f2937;
            --gray: #6b7280;
            --light-gray: #e5e7eb;
            --background: #f5f3ff;
            --white: #ffffff;
            --success: #16a34a;
            --danger: #dc2626;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #ede9fe 0,
                    #f5f3ff 35%,
                    #fdf2f8 100%
                );

            color: var(--dark);
            min-height: 100vh;
        }

        /* ==============================
           NAVBAR
        ============================== */

        .navbar {
            width: 100%;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(0, 0, 0, 0.06);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 22px;
            font-weight: 800;
            color: var(--dark);

            text-decoration: none;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            color: white;
            font-size: 22px;

            box-shadow:
                0 5px 15px rgba(124, 58, 237, 0.25);
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            border: none;
            outline: none;

            cursor: pointer;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 11px 18px;

            border-radius: 10px;

            font-size: 14px;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            color: white;

            box-shadow:
                0 6px 18px rgba(124, 58, 237, 0.25);
        }

        .btn-secondary {
            background: white;
            color: var(--dark);

            border: 1px solid var(--light-gray);
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--danger);
        }

        /* ==============================
           MAIN
        ============================== */

        .page-container {
            width: min(1200px, calc(100% - 30px));
            margin: 40px auto 70px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-header h1 {
            font-size: clamp(30px, 5vw, 48px);
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--gray);
            font-size: 16px;
        }

        /* ==============================
           COMIC HEADER
        ============================== */

        .comic-header {
            background: white;
            border-radius: 20px;

            padding: 30px;

            margin-bottom: 30px;

            box-shadow: var(--shadow);

            text-align: center;
        }

        .comic-title {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;

            color: var(--dark);

            margin-bottom: 10px;
        }

        .comic-description {
            max-width: 800px;
            margin: 0 auto;

            color: var(--gray);
            line-height: 1.7;
        }

        .comic-meta {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            gap: 10px;

            margin-top: 20px;
        }

        .meta-badge {
            padding: 7px 13px;

            border-radius: 999px;

            background: #f3e8ff;

            color: var(--primary-dark);

            font-size: 13px;
            font-weight: 700;
        }

        /* ==============================
           LOADING
        ============================== */

        .loading-container {
            min-height: 300px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            background: white;

            border-radius: 20px;

            box-shadow: var(--shadow);
        }

        .spinner {
            width: 55px;
            height: 55px;

            border-radius: 50%;

            border: 5px solid #e9d5ff;
            border-top-color: var(--primary);

            animation: spin 0.9s linear infinite;

            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: var(--gray);
            font-weight: 600;
        }

        /* ==============================
           COMIC GRID
        ============================== */

        .comic-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 30px;
        }

        /* ==============================
           COMIC PANEL
        ============================== */

        .comic-panel {
            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.12);

            border: 4px solid #111827;

            position: relative;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .comic-panel:hover {
            transform: translateY(-5px);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.18);
        }

        .panel-number {
            position: absolute;

            top: 12px;
            left: 12px;

            z-index: 5;

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #111827;
            color: white;

            font-weight: 900;

            border: 3px solid white;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .panel-image-container {
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #f3f4f6,
                    #e5e7eb
                );

            aspect-ratio: 4 / 3;

            overflow: hidden;
        }

        .panel-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            text-align: center;

            color: var(--gray);

            background:
                linear-gradient(
                    135deg,
                    #f5f3ff,
                    #fce7f3
                );
        }

        .panel-content {
            padding: 20px;
        }

        .narration {
            background: #fef3c7;

            border: 2px solid #f59e0b;

            border-radius: 10px;

            padding: 12px 15px;

            margin-bottom: 15px;

            color: #78350f;

            font-size: 14px;

            line-height: 1.6;

            font-weight: 600;
        }

        .dialogue-list {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .dialogue {
            position: relative;

            padding: 12px 15px;

            border-radius: 14px;

            background: #f9fafb;

            border: 1px solid #e5e7eb;

            line-height: 1.5;
        }

        .dialogue-character {
            font-size: 13px;

            font-weight: 800;

            color: var(--primary);

            margin-bottom: 4px;
        }

        .dialogue-text {
            color: var(--dark);

            font-size: 14px;
        }

        .dialogue.bubble {
            border-radius: 18px;

            background: white;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* ==============================
           FOOTER ACTIONS
        ============================== */

        .bottom-actions {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 40px;
        }

        /* ==============================
           ERROR
        ============================== */

        .error-container {
            background: white;

            border-radius: 20px;

            padding: 40px 25px;

            text-align: center;

            box-shadow: var(--shadow);
        }

        .error-icon {
            font-size: 50px;

            margin-bottom: 15px;
        }

        .error-container h2 {
            margin-bottom: 10px;
        }

        .error-container p {
            color: var(--gray);

            margin-bottom: 25px;

            line-height: 1.6;
        }

        /* ==============================
           EMPTY STATE
        ============================== */

        .empty-state {
            background: white;

            border-radius: 20px;

            padding: 50px 25px;

            text-align: center;

            box-shadow: var(--shadow);
        }

        .empty-icon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--gray);

            margin-bottom: 25px;
        }

        /* ==============================
           PRINT
        ============================== */

        @media print {

            body {
                background: white;
            }

            .navbar,
            .page-header,
            .bottom-actions {
                display: none !important;
            }

            .page-container {
                width: 100%;
                margin: 0;
            }

            .comic-header {
                box-shadow: none;
                border: none;
            }

            .comic-grid {
                display: block;
            }

            .comic-panel {
                margin-bottom: 30px;

                page-break-inside: avoid;

                box-shadow: none;
            }
        }

        /* ==============================
           TABLET
        ============================== */

        @media (max-width: 900px) {

            .comic-grid {
                grid-template-columns: 1fr;
            }

            .comic-panel {
                max-width: 700px;
                margin-left: auto;
                margin-right: auto;

                width: 100%;
            }
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .navbar {
                height: auto;

                padding: 14px 16px;

                gap: 12px;
            }

            .brand {
                font-size: 18px;
            }

            .brand-icon {
                width: 36px;
                height: 36px;

                font-size: 18px;
            }

            .navbar-actions .btn span {
                display: none;
            }

            .navbar-actions .btn {
                width: 42px;
                height: 42px;

                padding: 0;
            }

            .page-container {
                width: min(100% - 20px, 1200px);

                margin-top: 25px;
            }

            .comic-header {
                padding: 22px 17px;
            }

            .comic-panel {
                border-width: 3px;
            }

            .panel-content {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         NAVBAR
    ============================== -->

    <nav class="navbar">

        <a href="/" class="brand">

            <div class="brand-icon">
                🎨
            </div>

            <span>
                ComicCraft
            </span>

        </a>

        <div class="navbar-actions">

            <button
                class="btn btn-secondary"
                onclick="goBack()"
                title="Back to Creator"
            >
                ←
                <span>Back</span>
            </button>

            <button
                class="btn btn-primary"
                onclick="printComic()"
                title="Print Comic"
            >
                🖨️
                <span>Print</span>
            </button>

        </div>

    </nav>


    <!-- ==============================
         MAIN
    ============================== -->

    <main class="page-container">

        <section class="page-header">

            <h1>
                Comic Preview
            </h1>

            <p>
                Your AI-generated comic story is ready.
            </p>

        </section>


        <!-- ==============================
             COMIC CONTAINER
        ============================== -->

        <div id="comicContainer">

            <!-- Loading state -->

            <div
                id="loadingContainer"
                class="loading-container"
            >

                <div class="spinner"></div>

                <div class="loading-text">
                    Loading your comic...
                </div>

            </div>

        </div>


        <!-- ==============================
             BOTTOM ACTIONS
        ============================== -->

        <div
            id="bottomActions"
            class="bottom-actions"
            style="display: none;"
        >

            <button
                class="btn btn-secondary"
                onclick="goBack()"
            >
                ← Create Another Comic
            </button>

            <button
                class="btn btn-primary"
                onclick="printComic()"
            >
                🖨️ Print / Save PDF
            </button>

        </div>

    </main>


    <script>

        /* ==========================================
           GLOBAL VARIABLES
        ========================================== */

        let comicData = null;


        /* ==========================================
           DEMO COMIC DATA
           
           This is used only if no API data
           is available.
        ========================================== */

        const demoComic = {

            title: "The Cosmic Adventure",

            description:
                "A young explorer discovers a mysterious portal and begins an incredible journey through the stars.",

            genre: "Sci-Fi",

            style: "Comic Book",

            panels: [

                {
                    image:
                        "https://placehold.co/1000x750/7c3aed/ffffff?text=Panel+1",

                    narration:
                        "On a quiet evening, Maya discovered something strange in the old laboratory.",

                    dialogues: [

                        {
                            character: "Maya",
                            text:
                                "What is that glowing light?"
                        },

                        {
                            character: "Robot",
                            text:
                                "Unknown energy detected."
                        }

                    ]
                },

                {
                    image:
                        "https://placehold.co/1000x750/ec4899/ffffff?text=Panel+2",

                    narration:
                        "The mysterious portal suddenly opened in front of Maya.",

                    dialogues: [

                        {
                            character: "Maya",
                            text:
                                "A portal... to somewhere else?"
                        },

                        {
                            character: "Robot",
                            text:
                                "Probability of danger: 87%."
                        }

                    ]
                },

                {
                    image:
                        "https://placehold.co/1000x750/2563eb/ffffff?text=Panel+3",

                    narration:
                        "Without hesitation, Maya stepped through the portal.",

                    dialogues: [

                        {
                            character: "Maya",
                            text:
                                "Only one way to find out!"
                        }

                    ]
                },

                {
                    image:
                        "https://placehold.co/1000x750/16a34a/ffffff?text=Panel+4",

                    narration:
                        "She arrived on a beautiful alien planet filled with floating islands.",

                    dialogues: [

                        {
                            character: "Maya",
                            text:
                                "This is incredible!"
                        },

                        {
                            character: "Robot",
                            text:
                                "New world discovered."
                        }

                    ]
                }

            ]
        };


        /* ==========================================
           INITIALIZE
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadComic();

            }
        );


        /* ==========================================
           LOAD COMIC
        ========================================== */

        async function loadComic() {

            showLoading();

            try {

                /*
                 * First try to get comic data from
                 * browser localStorage.
                 *
                 * This is useful when the creator
                 * page stores generated data before
                 * redirecting to this page.
                 */

                


                /*
                 * Try URL query parameter.
                 *
                 * Example
                 * ```javascript
// Do not automatically load an old comic from localStorage.
// The preview should display the newly generated comic.

localStorage.removeItem("comicData");
```

                 *
                 * /comic-preview?comic_id=123
                 */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const comicId =
                    params.get("comic_id") ||
                    params.get("id");


                /*
                 * If comic ID exists, request data
                 * from backend.
                 */

                if (comicId) {

                    const response =
                        await fetch(
                            `/api/comic/${encodeURIComponent(comicId)}`
                        );

                    if (!response.ok) {

                        throw new Error(
                            "Unable to load comic from server."
                        );

                    }

                    const data =
                        await response.json();

                    comicData =
                        normalizeComicData(data);

                    renderComic(comicData);

                    return;
                }


                /*
                 * Try generic API endpoint.
                 *
                 * This supports a backend route such as:
                 *
                 * GET /api/comic/latest
                 */

                try {

                    const response =
                        await fetch(
                            "/api/comic/latest",
                            {
                                method: "GET",
                                headers: {
                                    "Accept":
                                        "application/json"
                                }
                            }
                        );

                    if (response.ok) {

                        const data =
                            await response.json();

                        if (data) {

                            comicData =
                                normalizeComicData(data);

                            renderComic(comicData);

                            return;
                        }

                    }

                } catch (apiError) {

                    console.warn(
                        "Latest comic API unavailable.",
                        apiError
                    );

                }


                /*
                 * No backend data available.
                 *
                 * Show demo comic so the page
                 * can still be tested.
                 */

                comicData = demoComic;

                renderComic(comicData);

            } catch (error) {

                console.error(
                    "Comic loading error:",
                    error
                );

                showError(
                    "Unable to load the comic."
                );

            }

        }


        /* ==========================================
           NORMALIZE API DATA
        ========================================== */

        function normalizeComicData(data) {

            /*
             * Some backends return:
             *
             * {
             *   comic: {...}
             * }
             *
             * while others directly return:
             *
             * {
             *   title: "...",
             *   panels: [...]
             * }
             */

            if (
                data &&
                data.comic &&
                typeof data.comic === "object"
            ) {

                data = data.comic;

            }


            const normalized = {

                title:
                    data.title ||
                    data.name ||
                    "Untitled Comic",

                description:
                    data.description ||
                    data.summary ||
                    "",

                genre:
                    data.genre ||
                    "",

                style:
                    data.style ||
                    data.art_style ||
                    "",

                panels:
                    Array.isArray(data.panels)
                        ? data.panels
                        : []

            };


            /*
             * Normalize each panel.
             */

            normalized.panels =
                normalized.panels.map(
                    function (panel) {

                        return {

                            image:
                                panel.image ||
                                panel.image_url ||
                                panel.imageUrl ||
                                "",

                            narration:
                                panel.narration ||
                                panel.caption ||
                                panel.description ||
                                "",

                            dialogues:
                                normalizeDialogues(
                                    panel.dialogues ||
                                    panel.dialogue ||
                                    panel.speech ||
                                    []
                                )

                        };

                    }
                );


            return normalized;

        }


        /* ==========================================
           NORMALIZE DIALOGUES
        ========================================== */

        function normalizeDialogues(dialogues) {

            /*
             * If backend returns a single string.
             */

            if (typeof dialogues === "string") {

                return [

                    {
                        character: "Character",
                        text: dialogues
                    }

                ];

            }


            /*
             * If backend returns an object.
             */

            if (
                dialogues &&
                typeof dialogues === "object" &&
                !Array.isArray(dialogues)
            ) {

                return [

                    {
                        character:
                            dialogues.character ||
                            dialogues.speaker ||
                            "Character",

                        text:
                            dialogues.text ||
                            dialogues.dialogue ||
                            ""
                    }

                ];

            }


            /*
             * Array format.
             */

            if (Array.isArray(dialogues)) {

                return dialogues.map(
                    function (item) {

                        if (
                            typeof item === "string"
                        ) {

                            return {

                                character:
                                    "Character",

                                text:
                                    item

                            };

                        }

                        return {

                            character:
                                item.character ||
                                item.speaker ||
                                item.name ||
                                "Character",

                            text:
                                item.text ||
                                item.dialogue ||
                                item.content ||
                                ""

                        };

                    }
                );

            }


            return [];

        }


        /* ==========================================
           RENDER COMIC
        ========================================== */

        function renderComic(comic) {

            const container =
                document.getElementById(
                    "comicContainer"
                );

            if (!container) {
                return;
            }


            if (
                !comic ||
                !Array.isArray(comic.panels) ||
                comic.panels.length === 0
            ) {

                showEmptyState();

                return;

            }


            const title =
                escapeHTML(
                    comic.title ||
                    "Untitled Comic"
                );


            const description =
                escapeHTML(
                    comic.description || ""
                );


            let html = `

                <section class="comic-header">

                    <h2 class="comic-title">
                        ${title}
                    </h2>

                    ${
                        description
                            ? `
                                <p class="comic-description">
                                    ${description}
                                </p>
                              `
                            : ""
                    }

                    <div class="comic-meta">

                        ${
                            comic.genre
                                ? `
                                    <span class="meta-badge">
                                        🎭 ${escapeHTML(comic.genre)}
                                    </span>
                                  `
                                : ""
                        }

                        ${
                            comic.style
                                ? `
                                    <span class="meta-badge">
                                        🎨 ${escapeHTML(comic.style)}
                                    </span>
                                  `
                                : ""
                        }

                        <span class="meta-badge">
                            📖 ${comic.panels.length} Panels
                        </span>

                    </div>

                </section>


                <section class="comic-grid">
            `;


            comic.panels.forEach(
                function (panel, index) {

                    html += createPanelHTML(
                        panel,
                        index
                    );

                }
            );


            html += `
                </section>
            `;


            container.innerHTML = html;


            const actions =
                document.getElementById(
                    "bottomActions"
                );

            if (actions) {

                actions.style.display = "flex";

            }

        }


        /* ==========================================
           CREATE PANEL HTML
        ========================================== */

        function createPanelHTML(
            panel,
            index
        ) {

            const image =
                panel.image || "";


            const narration =
                panel.narration || "";


            const dialogues =
                Array.isArray(panel.dialogues)
                    ? panel.dialogues
                    : [];


            let html = `

                <article class="comic-panel">

                    <div class="panel-number">
                        ${index + 1}
                    </div>

                    <div class="panel-image-container">
            `;


            if (image) {

                html += `

                    <img
                        class="panel-image"
                        src="${escapeAttribute(image)}"
                        alt="Comic panel ${index + 1}"
                        loading="lazy"
                        onerror="handleImageError(this)"
                    >

                `;

            } else {

                html += `

                    <div class="image-placeholder">

                        <div>

                            <div
                                style="
                                    font-size: 42px;
                                    margin-bottom: 10px;
                                "
                            >
                                🎨
                            </div>

                            <strong>
                                Image not available
                            </strong>

                            <div
                                style="
                                    margin-top: 5px;
                                    font-size: 13px;
                                "
                            >
                                Panel ${index + 1}
                            </div>

                        </div>

                    </div>

                `;

            }


            html += `

                    </div>

                    <div class="panel-content">
            `;


            if (narration) {

                html += `

                    <div class="narration">

                        📜
                        ${escapeHTML(narration)}

                    </div>

                `;

            }


            if (dialogues.length > 0) {

                html += `
                    <div class="dialogue-list">
                `;


                dialogues.forEach(
                    function (dialogue) {

                        const character =
                            escapeHTML(
                                dialogue.character ||
                                "Character"
                            );

                        const text =
                            escapeHTML(
                                dialogue.text ||
                                ""
                            );


                        if (!text) {
                            return;
                        }


                        html += `

                            <div class="dialogue bubble">

                                <div class="dialogue-character">

                                    ${character}

                                </div>

                                <div class="dialogue-text">

                                    ${text}

                                </div>

                            </div>

                        `;

                    }
                );


                html += `
                    </div>
                `;

            }


            html += `

                    </div>

                </article>

            `;


            return html;

        }


        /* ==========================================
           IMAGE ERROR HANDLER
        ========================================== */

        function handleImageError(imageElement) {

            const container =
                imageElement.parentElement;


            if (!container) {
                return;
            }


            container.innerHTML = `

                <div class="image-placeholder">

                    <div>

                        <div
                            style="
                                font-size: 42px;
                                margin-bottom: 10px;
                            "
                        >
                            🖼️
                        </div>

                        <strong>
                            Image unavailable
                        </strong>

                        <div
                            style="
                                margin-top: 5px;
                                font-size: 13px;
                            "
                        >
                            The generated image could not
                            be loaded.
                        </div>

                    </div>

                </div>

            `;

        }


        /* ==========================================
           LOADING STATE
        ========================================== */

        function showLoading() {

            const container =
                document.getElementById(
                    "comicContainer"
                );


            if (!container) {
                return;
            }


            container.innerHTML = `

                <div
                    id="loadingContainer"
                    class="loading-container"
                >

                    <div class="spinner"></div>

                    <div class="loading-text">

                        Loading your comic...

                    </div>

                </div>

            `;

        }


        /* ==========================================
           ERROR STATE
        ========================================== */

        function showError(message) {

            const container =
                document.getElementById(
                    "comicContainer"
                );


            if (!container) {
                return;
            }


            container.innerHTML = `

                <div class="error-container">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <h2>
                        Something went wrong
                    </h2>

                    <p>
                        ${escapeHTML(message)}
                    </p>

                    <button
                        class="btn btn-primary"
                        onclick="loadComic()"
                    >
                        🔄 Try Again
                    </button>

                </div>

            `;

        }


        /* ==========================================
           EMPTY STATE
        ========================================== */

        function showEmptyState() {

            const container =
                document.getElementById(
                    "comicContainer"
                );


            if (!container) {
                return;
            }


            container.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        📖
                    </div>

                    <h2>
                        No comic panels found
                    </h2>

                    <p>
                        Generate a comic first,
                        then come back to the preview.
                    </p>

                    <button
                        class="btn btn-primary"
                        onclick="goBack()"
                    >
                        ✨ Create Comic
                    </button>

                </div>

            `;

        }


        /* ==========================================
           BACK TO CREATOR
        ========================================== */

        function goBack() {

            /*
             * Change this URL if your creator
             * page has another route.
             */

            window.location.href = "/";

        }


        /* ==========================================
           PRINT COMIC
        ========================================== */

        function printComic() {

            window.print();

        }


        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            if (value === null ||
                value === undefined) {

                return "";

            }


            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* ==========================================
           ESCAPE ATTRIBUTE
        ========================================== */

        function escapeAttribute(value) {

            return escapeHTML(value);

        }

    </script>

</body>
</html>
